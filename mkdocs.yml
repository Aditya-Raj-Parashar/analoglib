      - Hardware Pipeline & Profiling: tutorials/hardware-pipeline.md
  - Troubleshooting & Reference:
      - Common Errors: troubleshooting/common-errors.md
      - API Reference: api/index.md
      - Roadmap: roadmap/roadmap.md
  - Specifications & Developer Notes:
      - AIR Architecture Guide: air_guide.md
      - Full API Reference (Single Page): api_reference.md
      - Core Concepts Specification: core_concepts.md
      - Architecture & Design Overview: getting_started.md

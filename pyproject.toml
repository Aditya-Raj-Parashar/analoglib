[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analoglib"
version = "0.1.0"
description = "Open-source analog in-memory computing library for resistive crossbar neural network simulation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Aditya Raj Parashar", email = "adityarajparashar@gmail.com"}
]
keywords = [
    "analog-computing", "reram", "crossbar", "memristor",
    "neuromorphic", "in-memory-computing", "neural-network",
    "hardware-simulation", "spice", "air"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.24",
    "pycryptodome>=3.19",
    "msgpack>=1.0.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
tensorflow = ["tensorflow>=2.13"]
viz = ["matplotlib>=3.7"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "build>=1.0.0",
    "twine>=4.0.0",
]
all = [
    "analoglib[torch,tensorflow,viz,dev]",
]

[project.urls]
Homepage = "https://github.com/Aditya-Raj-Parashar/analoglib"
Documentation = "https://github.com/Aditya-Raj-Parashar/analoglib/tree/main/docs"
Repository = "https://github.com/Aditya-Raj-Parashar/analoglib"
Issues = "https://github.com/Aditya-Raj-Parashar/analoglib/issues"

[project.scripts]
analog = "analoglib.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["analoglib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

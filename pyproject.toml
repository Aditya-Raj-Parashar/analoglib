[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analoglib"
version = "0.1.0"
description = "Open-source analog computing library for resistive crossbar neural network simulation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AnalogLib Contributors"}
]
keywords = [
    "analog-computing", "reram", "crossbar", "memristor",
    "neuromorphic", "in-memory-computing", "neural-network",
    "hardware-simulation"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24",
    "pycryptodome>=3.19",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
tensorflow = ["tensorflow>=2.13"]
viz = ["matplotlib>=3.7"]
cli = ["click>=8.1"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
all = [
    "analoglib[torch,tensorflow,viz,cli,dev]",
]

[project.scripts]
analog = "analoglib.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["analoglib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
